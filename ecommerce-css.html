<!DOCTYPE html>
<html>
<head>
    <title>IronCore Fitness Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        *{margin:0;padding:0;box-sizing:border-box;}

        body{
            font-family:'Segoe UI',sans-serif;
            background:linear-gradient(to right,#0f0f0f,#1a1a1a);
            color:#f5f5f5;
        }

        nav{
            background:#000;
            padding:12px;
            text-align:center;
        }

        nav a{
            color:#ccc;
            text-decoration:none;
            margin:0 15px;
            font-weight:bold;
        }

        nav a:hover{color:white;}

        header{
            text-align:center;
            padding:40px;
        }

        .products{
            display:flex;
            justify-content:center;
            flex-wrap:wrap;
            gap:30px;
            padding:40px;
        }

        .product{
            background:#222;
            padding:20px;
            border-radius:10px;
            width:250px;
            text-align:center;
        }

        .product img{
            width:150px;
            height:150px;
            border-radius:8px;
        }

        button{
            margin-top:10px;
            padding:8px 15px;
            border:none;
            background:#444;
            color:white;
            border-radius:20px;
            cursor:pointer;
        }

        button:hover{background:#666;}

        footer{
            text-align:center;
            padding:20px;
            background:#111;
        }
    </style>
</head>

<body>

<nav>
    <a href="ecommerce-css.html">E-Commerce CSS</a>
    <a href="ecommerce.html">E-Commerce</a>
    <a href="personal-css.html">Personal CSS</a>
    <a href="personal.html">Personal</a>
</nav>

<header>
    <h1>💪 IronCore Fitness</h1>
    <p>Premium Gym Equipment & Supplements</p>
</header>

<section class="products">
    <div class="product">
        <h3>Dumbbells</h3>
        <img src="gymer_jason-crossfit-1126999_1920.jpg" alt="Dumbbell">
        <p>₹4,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <h3>Whey Protein</h3>
        <img src="istockphoto-174988875-1024x1024 copy.jpg" alt="Whey Protein">
        <p>₹2,499</p>
        <button>Add to Cart</button>
    </div>
</section>

<footer>
    © 2026 IronCore Fitness
</footer>

</body>
</html>
